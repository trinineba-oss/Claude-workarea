# Producer Mode settings. Edit the live copy at /data/adb/producer-mode/producer.conf
# (it survives module updates). 1 = enabled, 0 = disabled.
# Every tweak is OFF by default: enable ONE, measure it (results/RESULTS.md), keep it only if it helps.

# --- CPU ---
# Raise scaling_min_freq on every policy to the lowest available step >= this % of max.
# Keeps the existing governor (gentler option, try first). 0 = off.
CPU_MINFREQ_PCT=0
# Switch all policies to the "performance" governor (heavier; mutually exclusive with above in practice).
CPU_GOVERNOR_PERF=0
# uclamp.min for the top-app cgroup while ON (0-100, percent). 0 = off.
TOPAPP_UCLAMP_MIN=0

# --- System ---
DOZE_WHITELIST=0
ANIMATIONS_OFF=0
# Turning Wi-Fi off kills wireless ADB. Leave 0 unless you really mean it.
WIFI_OFF=0
BLUETOOTH_OFF=0

# --- Audio (experimental) ---
# resetprop aaudio.mmap_policy=2 / aaudio.mmap_exclusive_policy=2 (only if HAL supports MMAP).
AUDIO_MMAP=0
# ro.audio.flinger_standbytime_ms value in ms (e.g. 60000). 0 = off. Takes effect only after an
# audioserver restart, which is done only if AUDIO_RESTART=1 (interrupts playing audio briefly).
AUDIO_STANDBY_MS=0
AUDIO_RESTART=0

# --- Auto mode ---
# Switch ON while an app from apps.list is in the foreground, OFF otherwise.
AUTO_MODE=0
AUTO_POLL_SEC=5
